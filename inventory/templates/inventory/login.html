{% extends 'inventory/base.html' %}

{% content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4">Connexion StockPro</h3>
                
                {% if form.errors %}
                    <div class="alert alert-danger">Nom d'utilisateur ou mot de passe incorrect.</div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-dark w-100 mt-3">Se Connecter</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endcontent %}
